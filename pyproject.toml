[project]
name = "navedenie"
version = "0.1.2"
description = "Биологически структурированный агент наведения воздух–воздух"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=2.0",
  "pydantic>=2.0",
  "websockets>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["navedenie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
