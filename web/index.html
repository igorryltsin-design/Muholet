<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мухолет — перехват по коннектому дрозофилы</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // фатальные ошибки — видимым текстом, чтобы стенд не молчал чёрным экраном
      window.addEventListener('error', function (e) {
        var d = document.createElement('pre')
        d.style.cssText =
          'position:fixed;top:0;left:0;z-index:9999;background:#2a0d08;color:#ffb4a4;padding:10px;font:12px/1.5 monospace;white-space:pre-wrap;max-width:100vw;margin:0'
        d.textContent = 'Ошибка стенда: ' + (e.error && e.error.stack ? e.error.stack : e.message)
        ;(document.body || document.documentElement).appendChild(d)
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
